services:

  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    environment:
      - node.name=es01
      - cluster.name=docker-cluster
      - discovery.type=single-node
      - ELASTIC_PASSWORD=admin_password123
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      # FIX 1: Set Heap to 50% of your container memory limit
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    # FIX 2: Raise container memory limit slightly if possible to accommodate JVM overhead
    mem_limit: 3221225472 # 3GB (Recommended) or keep 2147483648 (2GB)
    ulimits:
      memlock:
        soft: -1
        hard: -1
    # FIX 3: Fix healthcheck authentication and match real API responses
    healthcheck:
      test: [ "CMD-SHELL", "curl -u elastic:admin_password123 -s http://localhost:9200 | grep -q 'cluster_name'" ]
      interval: 10s
      timeout: 10s
      retries: 120

  kibana:
    depends_on:
      es01:
        condition: service_healthy
    image: docker.elastic.co/kibana/kibana:8.17.0
    volumes:
      - kibanadata:/usr/share/kibana/data
    ports:
      - 5601:5601
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=http://es01:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=admin_password123
    mem_limit: 2147483648
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'"]
      interval: 10s
      timeout: 10s
      retries: 120

  id-db:
    image: postgres
    container_name: id-db
    environment:
      - POSTGRES_USER=identity
      - POSTGRES_DB=identity
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5432:5432"
    volumes:
      - id-db-data:/var/lib/postgresql
    profiles: 
      - id
  orders-db:
    image: postgres
    container_name: orders-db
    environment:
      - POSTGRES_USER=orders
      - POSTGRES_DB=orders
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5433:5432"
    volumes:
      - orders-db-data:/var/lib/postgresql
  inventory-db:
    image: postgres
    container_name: inventory-db
    environment:
      - POSTGRES_USER=inventory
      - POSTGRES_DB=inventory
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5434:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql
  rabbit-mq:
    image: rabbitmq:4.3-management-alpine
    container_name: mq-main
    hostname: main-hub
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password
    ports:
      - "5672:5672"
      - "15672:15672"
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: keycloak
    command: start
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HTTP_ENABLED=false
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTPS_CERTIFICATE_FILE=/opt/keycloak/certs/cert.pem
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/opt/keycloak/certs/key.pem
      - KC_HOSTNAME=localhost
      - KC_HTTPS_PORT=8443
    ports:
      - 127.0.0.1:8443:8443
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./certs:/opt/keycloak/certs:ro

volumes:
  id-db-data:
  orders-db-data:
  inventory-db-data:
  keycloak-data:
  esdata:
    driver: local
  kibanadata:
    driver: local